<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page introuvable — SPVoyages</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="img/logo.png" type="image/png">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--color-primary:#E63950;--color-accent:#C4841A;--color-bg:#FBF6EF;--color-fg:#2B211C;--color-muted:#6B5D53;--color-border:#E8DDCE;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--color-bg);color:var(--color-fg);font-family:'Inter',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;}
  .code{font-family:'Fraunces',serif;font-size:clamp(4rem,14vw,8rem);font-weight:700;color:var(--color-primary);line-height:1;}
  h1{font-family:'Fraunces',serif;font-size:clamp(1.4rem,3vw,2rem);margin:12px 0 10px;}
  p{color:var(--color-muted);margin-bottom:28px;max-width:420px;margin-left:auto;margin-right:auto;}
  .btn{display:inline-block;padding:14px 30px;border-radius:999px;background:var(--color-accent);color:#fff;font-weight:600;text-decoration:none;}
</style>
</head>
<body>
  <div>
    <div class="code">404</div>
    <h1>Cette page n'existe pas</h1>
    <p>Le lien que vous avez suivi est peut-être obsolète, ou l'adresse a été mal saisie.</p>
    <a class="btn" href="index.html">Retour à l'accueil</a>
  </div>
</body>
</html>
